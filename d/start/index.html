<script>(function(){var slow=false,el=new Audio(),cur=null,voice="gia";
try{var sv=localStorage.getItem("tpd-voice");if(sv==="gia"||sv==="mark")voice=sv;}catch(e){}
function mark(id,on){document.querySelectorAll('[data-say="'+id+'"]').forEach(function(n){n.classList.toggle("playing",on);});}
document.querySelectorAll("[data-say]").forEach(function(b){b.addEventListener("click",function(){var id=b.getAttribute("data-say");if(cur)mark(cur,false);cur=id;mark(id,true);el.pause();el.src="../../a/start/"+voice+"/"+id+(slow?"_slow":"")+".mp3";el.onended=function(){mark(id,false);};el.play().catch(function(){mark(id,false);});});});
document.querySelectorAll("[data-speed]").forEach(function(b){b.addEventListener("click",function(){slow=b.getAttribute("data-speed")==="slow";document.querySelectorAll("[data-speed]").forEach(function(x){x.setAttribute("aria-pressed",String(x===b));});});});
function setV(v){voice=v;try{localStorage.setItem("tpd-voice",v);}catch(e){}document.querySelectorAll("[data-voice]").forEach(function(x){x.setAttribute("aria-pressed",String(x.getAttribute("data-voice")===v));});}
document.querySelectorAll("[data-voice]").forEach(function(b){b.addEventListener("click",function(){setV(b.getAttribute("data-voice"));});});setV(voice);
})();</script></body></html>
